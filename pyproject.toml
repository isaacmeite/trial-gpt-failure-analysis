[project]
name = "trial-gpt-investigation"
version = "0.1.0"
description = "Reproducible analysis of clinical trial eligibility classification failures"
requires-python = ">=3.12, <3.13"
dependencies = [
    "datasets>=5.1.0",
    "openai>=3.37.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alterra_trialgpt"]

[tool.ruff]
extend-exclude = ["references"]